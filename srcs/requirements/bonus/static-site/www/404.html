<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
		}

		.container {
			text-align: center;
			padding: 20px;
		}

		.error-code {
			font-size: 6rem;
			font-weight: 800;
			margin-bottom: 10px;
		}

		.error-message {
			font-size: 2rem;
			margin-bottom: 20px;
			font-weight: 300;
		}

		.error-description {
			font-size: 1.1rem;
			margin-bottom: 40px;
			opacity: 0.9;
		}

		.back-button {
			display: inline-block;
			background: white;
			color: #667eea;
			padding: 12px 30px;
			border-radius: 50px;
			text-decoration: none;
			font-weight: 600;
			transition: all 0.3s ease;
		}

		.back-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="error-code">404</div>
		<div class="error-message">Page Not Found</div>
		<div class="error-description">The page you're looking for doesn't exist.</div>
		<a href="/" class="back-button">Go Back Home</a>
	</div>
</body>
</html>
