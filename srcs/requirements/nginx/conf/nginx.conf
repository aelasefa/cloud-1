events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;

    # Port 80: Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name DOMAIN_NAME_PLACEHOLDER;

        return 301 https://$host$request_uri;
    }

    # Port 443: SSL and Unified Routing
    server {
        listen 443 ssl;
        server_name DOMAIN_NAME_PLACEHOLDER;

        ssl_certificate     /etc/ssl/certs/server.crt;
        ssl_certificate_key /etc/ssl/private/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root  /var/www/html;
        index index.php index.html;

        # 1. Main WordPress Blog
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            fastcgi_pass  wordpress:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
        }

        # 2. Database UI (Adminer)
        location /adminer {
            proxy_pass http://adminer:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Static Site
        location /static/ {
            proxy_pass http://static-site:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}